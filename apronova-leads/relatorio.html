<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Acessos · Apronova Leads</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#f3f3f5;--card:#fff;--fg:#141417;--muted:#5b5b65;--line:rgba(20,20,26,.08);--accent:#d7192a;--ink:#0d0d0f;
--fd:"Poppins","Helvetica Neue",Arial,sans-serif;--fb:"Plus Jakarta Sans",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:18px}
.hero{border-radius:28px;padding:24px 26px;color:#f3f3f5;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:radial-gradient(120% 140% at 100% 0%,rgba(225,29,42,.6),transparent 55%),radial-gradient(100% 120% at 0% 100%,rgba(122,10,18,.55),transparent 60%),var(--ink)}
.hero img.s{height:44px}.hero img.w{height:16px;display:block;margin-bottom:6px}
.hero h1{margin:0;font-family:var(--fd);font-weight:600;font-size:24px}.hero p{margin:2px 0 0;color:#b4b4bd}
.hero .grow{flex:1}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.btn.p{color:#fff;background:linear-gradient(135deg,#ff4d57,#d7192a 60%,#9a0f18)}
.btn.g{background:rgba(255,255,255,.12);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:0 10px 28px -18px rgba(30,10,14,.3)}
.stat b{display:block;font-family:var(--fd);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.card{background:var(--card);border-radius:24px;padding:8px;box-shadow:0 10px 28px -18px rgba(30,10,14,.3)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 10px 4px}
.tools input,.tools select{border:1px solid var(--line);background:#f7f7f9;border-radius:999px;padding:9px 14px;font:inherit;min-width:0}
.x{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.n{font-weight:700}.m{color:var(--muted);font-size:12px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#f3f3f5;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip i{font-style:normal;color:var(--accent);margin-left:4px;font-family:var(--fm);font-size:11px}
.live{display:inline-flex;align-items:center;gap:6px;color:#1f9b66;font-weight:700;font-size:12px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#1f9b66;box-shadow:0 0 0 4px rgba(31,155,102,.18)}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:12px}
details ol{margin:8px 0 0;padding-left:18px;max-height:220px;overflow:auto;font-size:12.5px;line-height:1.55}
.empty{padding:40px;text-align:center;color:var(--muted)}
.lock{max-width:420px;margin:12vh auto 0;background:var(--card);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -24px rgba(30,10,14,.35)}
.lock h1{margin:0;font-family:var(--fd);font-size:20px}.lock input{border:1px solid var(--line);background:#f7f7f9;border-radius:999px;padding:13px 16px;font:inherit}
.err{color:#cf1f3d;font-weight:600;font-size:13px}
.ped-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ped-h h2{margin:0;font-family:var(--fd);font-size:17px;font-weight:600}
.badge{background:#d7192a;color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow .who{flex:1;min-width:180px}.st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.st.pendente{background:#fff4e0;color:#a66300}.st.liberado{background:#e3f6ec;color:#1f7a50}.st.negado{background:#fde8eb;color:#b3122a}
.btn.ok{background:#1f9b66;color:#fff}.btn.no{background:#f3f3f5;color:#141417}.btn.sm{padding:7px 14px;font-size:13px}
[hidden]{display:none!important}
</style></head><body>

async function loadPeds(){try{peds=await call('apronova_pedidos_lista',{chave})||[];renderPeds()}catch(e){}}
function renderPeds(){const pend=peds.filter(p=>p.status==='pendente');const list=showAll?peds.slice(0,40):pend;
  $('#ped').innerHTML=`<div class="ped-h"><h2>Pedidos de liberação</h2>${pend.length?`<span class="badge">${pend.length} aguardando</span>`:''}<span style="flex:1"></span><button class="btn no sm" id="pall" type="button">${showAll?'Só pendentes':'Ver todos'}</button></div>
  ${list.length?list.map(p=>`<div class="prow"><div class="who"><div class="n">${esc(p.nome)}</div><div class="m">${esc(p.contato||'sem contato')} · ${esc(p.dispositivo||'')} · pediu ${dt(p.criado)}</div></div><span class="st ${p.status}">${p.status}</span>${p.status!=='liberado'?`<button class="btn ok sm" data-dec="liberado" data-id="${esc(p.id)}">Liberar</button>`:''}${p.status!=='negado'?`<button class="btn no sm" data-dec="negado" data-id="${esc(p.id)}">${p.status==='liberado'?'Bloquear':'Negar'}</button>`:''}</div>`).join(''):'<div class="m" style="padding:6px 0">Nenhum pedido aguardando.</div>'}`;
  $('#pall').onclick=()=>{showAll=!showAll;renderPeds()};
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-dec]');if(!b)return;b.disabled=true;try{await call('apronova_decidir',{chave,pid:b.dataset.id,novo:b.dataset.dec});await loadPeds()}catch(x){b.disabled=false;alert('Não foi possível salvar.')}});
async function load(){loadPeds();
  const r=await fetch(URL_RPC,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({chave})});
  if(!r.ok){if(r.status===401||r.status===403||r.status===400){try{sessionStorage.removeItem('rk')}catch(e){};showLock(true);return}throw new Error('falha')}
  rows=await r.json();try{sessionStorage.setItem('rk',chave)}catch(e){}
  $('#lock').hidden=true;$('#app').hidden=false;$('#upd').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});render();
}
function render(){
  const q=$('#q').value.trim().toLowerCase(),per=$('#per').value;const since=per==='all'?0:(()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(+per-1));return d.getTime()})();
  const R=rows.filter(x=>(!q||x.nome.toLowerCase().includes(q))&&new Date(x.inicio).getTime()>=since);
  const people=new Set(R.map(x=>x.nome.trim().toLowerCase())).size;const tot=R.reduce((s,x)=>s+(x.segundos||0),0);
  const live=R.filter(x=>Date.now()-new Date(x.ultimo).getTime()<90000).length;
  $('#stats').innerHTML=[['Acessos',R.length],['Pessoas',people],['Tempo total',dur(tot)],['Tempo médio',dur(R.length?Math.round(tot/R.length):0)],['Online agora',live]].map(([l,v])=>`<div class="stat"><span>${l}</span><b>${v}</b></div>`).join('');
  $('#tb').innerHTML=R.length?R.map(x=>{const on=Date.now()-new Date(x.ultimo).getTime()<90000;const telas=Object.entries(x.telas||{}).sort((a,b)=>b[1]-a[1]);const ev=(x.eventos||[]);
    return `<tr><td><div class="n">${esc(x.nome)}</div>${on?'<span class="live">online agora</span>':`<div class="m">última atividade ${dt(x.ultimo)}</div>`}</td>
    <td class="mono">${dt(x.inicio)}</td><td class="mono"><b>${dur(x.segundos)}</b></td>
    <td><div class="chips">${telas.map(([k,v])=>`<span class="chip">${esc(k)}<i>${dur(v)}</i></span>`).join('')||'<span class="m">nenhuma</span>'}</div></td>
    <td>${ev.length?`<details><summary>${ev.length} registros</summary><ol>${ev.map(e=>`<li><span class="mono m">${tm(e.t)}</span> ${esc(e.e)}</li>`).join('')}</ol></details>`:'<span class="m">nada</span>'}</td>
    <td class="m">${esc(x.dispositivo||'')}</td></tr>`}).join(''):`<tr><td colspan="6"><div class="empty">Nenhum acesso neste período.</div></td></tr>`;
}
function showLock(err){$('#app').hidden=true;$('#lock').hidden=false;$('#le').hidden=!err;setTimeout(()=>$('#k').focus(),50)}
$('#lf').addEventListener('submit',e=>{e.preventDefault();chave=$('#k').value.trim();if(chave)load().catch(()=>{$('#le').textContent='Não foi possível carregar. Tente de novo.';$('#le').hidden=false})});
$('#rf').addEventListener('click',()=>load().catch(()=>{}));
$('#q').addEventListener('input',render);$('#per').addEventListener('change',render);
setInterval(()=>{if(chave&&!document.hidden)load().catch(()=>{})},60000);
setInterval(()=>{if(chave&&!document.hidden&&!$('#app').hidden)loadPeds()},10000);
const u=new URLSearchParams(location.search);chave=u.get('k')||(()=>{try{return sessionStorage.getItem('rk')||''}catch(e){return''}})();
if(u.get('k'))history.replaceState(null,'',location.pathname);
if(chave)load().catch(()=>showLock(true));else showLock(false);
</script></body></html>
